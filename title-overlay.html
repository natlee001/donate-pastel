<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Live Title Overlay</title><style>@import url('https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&family=Montserrat:wght@400;500;600;700;800;900&family=Nunito:wght@400;500;600;700;800;900&family=Quicksand:wght@400;500;600;700&display=swap');*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden;font-family:"Be Vietnam Pro","Segoe UI",Arial,sans-serif}.title{position:absolute;white-space:pre-wrap;word-break:break-word;line-height:1.08;transform-origin:center;pointer-events:none}</style></head><body><div class="title" id="title"></div><script>
const el=document.getElementById('title');const p=new URLSearchParams(location.search);let s={text:'LIVE • GAME STREAM',font:'Be Vietnam Pro',weight:'800',color:'#fff',strokeColor:'#3b2354',size:'64',stroke:'3',shadow:'12',uppercase:false,glow:false,pulse:false,slide:true,left:'6',top:'8',align:'left',width:'88',frame:'none'};
try{const c=p.get('c');if(c)s={...s,...JSON.parse(decodeURIComponent(escape(atob(c.replace(/-/g,'+').replace(/_/g,'/')))))}}catch(e){}
el.textContent=s.uppercase?String(s.text).toUpperCase():s.text;el.style.fontFamily='\"'+s.font+'\", \"Be Vietnam Pro\", \"Segoe UI\", Arial, sans-serif';el.style.fontWeight=s.weight;el.style.color=s.color;el.style.fontSize=s.size+'px';el.style.webkitTextStroke=s.stroke+'px '+s.strokeColor;el.style.textShadow=`0 4px ${s.shadow}px rgba(0,0,0,.55)`;el.style.left=s.left+'%';el.style.top=s.top+'%';el.style.maxWidth=s.width+'%';el.style.textAlign=s.align;el.style.padding='0';el.style.border='0';el.style.borderRadius='0';el.style.background='transparent';el.style.boxShadow='none';
if(s.frame==='glass'){el.style.padding='13px 20px';el.style.border='1px solid rgba(255,255,255,.42)';el.style.borderRadius='18px';el.style.background='linear-gradient(135deg,rgba(255,255,255,.18),rgba(176,122,235,.16))';el.style.backdropFilter='blur(8px)';el.style.boxShadow='0 10px 30px rgba(0,0,0,.22)'}else if(s.frame==='neon'){el.style.padding='10px 18px';el.style.border='2px solid '+s.color;el.style.borderRadius='16px';el.style.background='rgba(12,5,20,.32)';el.style.boxShadow='0 0 8px '+s.color+',0 0 25px '+s.color+',inset 0 0 18px rgba(255,255,255,.08)'}else if(s.frame==='cute'){el.style.padding='12px 19px';el.style.border='2px solid #e7c9ff';el.style.borderRadius='22px';el.style.background='linear-gradient(135deg,rgba(80,35,110,.72),rgba(154,87,203,.58))';el.style.boxShadow='0 10px 28px rgba(0,0,0,.25),0 0 18px rgba(207,145,255,.35)'}else if(s.frame==='badge'){el.style.padding='10px 18px';el.style.border='2px solid rgba(255,255,255,.7)';el.style.borderRadius='10px';el.style.background='rgba(20,16,28,.78)';el.style.boxShadow='6px 6px 0 rgba(155,115,220,.8)'}
if(s.glow)el.style.filter='drop-shadow(0 0 9px '+s.color+')';if(s.pulse){const st=document.createElement('style');st.textContent='@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.025)}}';document.head.appendChild(st);el.style.animation='pulse 2.3s ease-in-out infinite'}if(s.slide){const st=document.createElement('style');st.textContent='@keyframes slide{from{opacity:0;transform:translateX(-35px)}to{opacity:1;transform:translateX(0)}}';document.head.appendChild(st);el.style.animation=s.pulse?'pulse 2.3s ease-in-out infinite,slide .65s ease-out both':'slide .65s ease-out both'}
</script></body></html>
