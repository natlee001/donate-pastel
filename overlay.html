<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Donate Overlay</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;height:100%;background:transparent;overflow:hidden;font-family:Arial,sans-serif}
.alert{position:absolute;right:30px;bottom:30px;width:420px;padding:22px 24px;border-radius:24px;
background:linear-gradient(135deg,rgba(255,255,255,.97),rgba(242,231,255,.97));
border:2px solid rgba(181,151,233,.55);box-shadow:0 18px 60px rgba(76,45,110,.28);
opacity:0;visibility:hidden;transform:translateY(25px) scale(.96);transition:opacity .4s ease,transform .4s ease,visibility .4s}
.alert.show{opacity:1;visibility:visible;transform:translateY(0) scale(1)}
.top{font-size:18px;font-weight:800;color:#7653b4}.amount{font-size:28px;font-weight:900;color:#9a6bd2;margin:6px 0 8px}
.msg{font-size:18px;color:#49395a;line-height:1.45;word-break:break-word;white-space:pre-wrap}.small{font-size:12px;color:#8a7b9a;margin-top:10px}
.test-badge{position:absolute;left:24px;top:20px;padding:8px 11px;border-radius:12px;background:rgba(255,230,245,.95);color:#8f4c73;font-size:12px;font-weight:800;display:none}
body.test .test-badge{display:block}
</style>
</head>
<body>
<div class="test-badge">TEST MODE</div>
<div class="alert" id="alert">
  <div class="top" id="name">💜 Có donate mới!</div>
  <div class="amount" id="amount">0đ</div>
  <div class="msg" id="content"></div>
  <div class="small">Cảm ơn bạn đã ủng hộ ✨</div>
</div>
<script>
const API='/api/latest';
let lastDonationId=localStorage.getItem('donate_last_id')||'';
let initialized=!!lastDonationId;
let busy=false;

function showDonation(data){
  busy=true;
  document.getElementById('name').textContent='💜 '+(data.name||'Một người bạn')+' đã donate';
  document.getElementById('amount').textContent=Number(data.amount||0).toLocaleString('vi-VN')+'đ';
  document.getElementById('content').textContent=data.content||'';
  document.getElementById('alert').classList.add('show');
  speak(data.content||'');
  setTimeout(()=>{document.getElementById('alert').classList.remove('show');busy=false;},10000);
}

let voicesReady=false;
function getVoices(){return speechSynthesis.getVoices()||[];}
function findVietnameseVoice(){
  const voices=getVoices();
  return voices.find(v=>String(v.lang||'').toLowerCase()==='vi-vn')
      ||voices.find(v=>String(v.lang||'').toLowerCase().startsWith('vi'))
      ||voices.find(v=>/(^|\s)an($|\s|-)/i.test(String(v.name||''))&&/^vi/i.test(String(v.lang||'')))
      ||null;
}
function refreshVoices(){voicesReady=true;}
speechSynthesis.onvoiceschanged=refreshVoices;
refreshVoices();

function waitForVietnameseVoice(timeout=3500){
  const immediate=findVietnameseVoice();
  if(immediate) return Promise.resolve(immediate);

  return new Promise(resolve=>{
    let done=false;
    const finish=()=>{
      if(done)return;
      done=true;
      clearInterval(timer);
      clearTimeout(stop);
      resolve(findVietnameseVoice());
    };
    const timer=setInterval(()=>{
      const v=findVietnameseVoice();
      if(v) finish();
    },120);
    const stop=setTimeout(finish,timeout);
  });
}

async function speak(text){
  if(!text)return;
  try{
    const voice=await waitForVietnameseVoice();

    // Never speak with an English fallback.
    if(!voice){
      console.warn('Không có voice tiếng Việt. Cài Vietnamese TTS voice trên Windows rồi khởi động lại OBS.');
      return;
    }

    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.voice=voice;
    u.lang=voice.lang||'vi-VN';
    u.rate=.95;
    u.pitch=1;
    u.volume=1;
    speechSynthesis.speak(u);
  }catch(e){
    console.error('TTS error',e);
  }
}

async function checkDonation(){
  if(busy)return;
  try{
    const r=await fetch(API+'?overlay=1&ts='+Date.now(),{cache:'no-store'});
    if(!r.ok)return;
    const d=await r.json();
    const x=d.latest;
    if(!x)return;
    const id=String(x.id||'');
    if(!id)return;

    if(!initialized){
      lastDonationId=id;
      localStorage.setItem('donate_last_id',id);
      initialized=true;
      return;
    }
    if(id===lastDonationId)return;

    lastDonationId=id;
    localStorage.setItem('donate_last_id',id);
    showDonation(x);
  }catch(e){}
}

function testDonation(){
  showDonation({
    id:'TEST-'+Date.now(),
    name:'Na',
    amount:50000,
    content:'Chúc bạn stream vui vẻ nha! 💜 Hôm nay chơi game thật hay nhé!'
  });
}

const params=new URLSearchParams(location.search);
if(params.get('test')==='1'){
  document.body.classList.add('test');
  setTimeout(testDonation,1200);
}else{
  checkDonation();
  setInterval(checkDonation,3000);
}
</script>
</body>
</html>
