<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Donate Overlay</title><style>*{box-sizing:border-box}body{margin:0;background:transparent;font-family:Arial,sans-serif;overflow:hidden}.alert{position:absolute;right:30px;bottom:30px;width:420px;padding:22px 24px;border-radius:24px;background:linear-gradient(135deg,rgba(255,255,255,.96),rgba(242,231,255,.96));border:2px solid rgba(181,151,233,.55);box-shadow:0 18px 60px rgba(76,45,110,.28);opacity:0;transform:translateY(20px) scale(.98);transition:.35s}.alert.show{opacity:1;transform:none}.top{font-size:18px;font-weight:800;color:#7653b4}.amount{font-size:28px;font-weight:900;color:#9a6bd2;margin:6px 0}.msg{font-size:18px;color:#49395a;line-height:1.45;word-break:break-word}.small{font-size:12px;color:#8a7b9a;margin-top:8px}</style></head><body><div class="alert" id="a"><div class="top" id="n">💜 Có donate mới!</div><div class="amount" id="m">0đ</div><div class="msg" id="c"></div><div class="small">Cảm ơn bạn đã ủng hộ ✨</div></div><script>
let last=localStorage.getItem('lastDonationId')||'';let busy=false;let initialized=!!last;
async function check(){if(busy)return;try{const r=await fetch('/api/latest?overlay=1&ts='+Date.now());const d=await r.json();const x=d.latest;if(!x||String(x.id)===last)return;if(!initialized){last=String(x.id);localStorage.setItem('lastDonationId',last);initialized=true;return;}last=String(x.id);localStorage.setItem('lastDonationId',last);show(x)}catch(e){}}
function show(x){busy=true;document.getElementById('n').textContent='💜 '+(x.name||'Một người bạn')+' đã donate';document.getElementById('m').textContent=Number(x.amount||0).toLocaleString('vi-VN')+'đ';document.getElementById('c').textContent=x.content||'';const a=document.getElementById('a');a.classList.add('show');speak(x.content||'');setTimeout(()=>{a.classList.remove('show');busy=false},10000)}
function speak(t){if(!t)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='vi-VN';u.rate=1;u.pitch=1;speechSynthesis.speak(u)}catch(e){}}
check();setInterval(check,3000);
</script></body></html>
